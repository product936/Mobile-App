document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"971b417c-0aae-47cb-bf24-0bbc7df2d40d\"><\u002Fscript>\n<\u002Fhead>\n<body>\n\n<x-dc>\n<helmet>\n<style>/* ============================================================\n * SingleInterface Design System — tokens\n * Mirrors src/Layout.jsx :root from the source codebase.\n * Import with: <link rel=\"stylesheet\" href=\"colors_and_type.css\">\n * ============================================================ */\n\n/* Hanken Grotesk — local variable fonts (replaces Google Fonts CDN).\n * Browsers automatically clamp to the variable axis range (100–900). */\n@font-face {\n  font-family: 'Hanken Grotesk';\n  src: url(\"15aa3c6b-0bf7-4ae5-9a37-e47a96497dd8\") format('truetype-variations'),\n       url(\"15aa3c6b-0bf7-4ae5-9a37-e47a96497dd8\") format('truetype');\n  font-weight: 100 900;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: 'Hanken Grotesk';\n  src: url(\"d3a4e186-2c0d-4e5b-a804-dc024a22f195\") format('truetype-variations'),\n       url(\"d3a4e186-2c0d-4e5b-a804-dc024a22f195\") format('truetype');\n  font-weight: 100 900;\n  font-style: italic;\n  font-display: swap;\n}\n\n:root {\n  /* ── Brand colors ───────────────────────────────────────── */\n  --si-primary-deep:        #0E0071;   /* sidebar bg, gradient start, brand anchor */\n  --si-primary-accent:      #0070FC;   /* CTAs, links, active indicators */\n  --si-primary-hover:       #0A0054;   /* 1 step darker than deep */\n  --si-primary-active:      #060038;   /* pressed state */\n  --si-secondary-hover:     #0E0071;\n  --si-secondary-active:    #0A0054;\n\n  /* ── AI gradients ───────────────────────────────────────── */\n  /* Primary — deep navy → electric blue. Default AI surface. */\n  --si-ai-gradient-start:        #0E0071;\n  --si-ai-gradient-end:          #0070FC;\n  --si-ai-gradient-hover-start:  #0A0054;\n  --si-ai-gradient-hover-end:    #005DD1;\n  --si-ai-text:                  #FFFFFF;\n  --si-ai-gradient:              linear-gradient(90deg, var(--si-ai-gradient-start) 0%, var(--si-ai-gradient-end) 100%);\n\n  /* Secondary — blue → purple. Reserved for generative / creative AI. */\n  --si-ai-gradient-2-start:      #3B82F6;\n  --si-ai-gradient-2-end:        #9333EA;\n  --si-ai-gradient-2:            linear-gradient(90deg, var(--si-ai-gradient-2-start) 0%, var(--si-ai-gradient-2-end) 100%);\n\n  /* Light tinted variants — use these on LIGHT surfaces (dark text on tinted bg). */\n  /* Primary light — wash of the navy→blue gradient, safe behind dark copy. */\n  --si-ai-gradient-light-start: #EEF2FF;   /* indigo-50 */\n  --si-ai-gradient-light-end:   #DBEAFE;   /* blue-100 */\n  --si-ai-gradient-light:       linear-gradient(90deg, var(--si-ai-gradient-light-start) 0%, var(--si-ai-gradient-light-end) 100%);\n\n  /* Secondary light — wash of the blue→purple gradient. */\n  --si-ai-gradient-2-light-start: #DBEAFE; /* blue-100 */\n  --si-ai-gradient-2-light-end:   #EDE9FE; /* violet-100 */\n  --si-ai-gradient-2-light:       linear-gradient(90deg, var(--si-ai-gradient-2-light-start) 0%, var(--si-ai-gradient-2-light-end) 100%);\n\n  /* Legacy tokens (kept for source-codebase parity) */\n  --si-ai-purple-start:     #9333EA;\n  --si-ai-purple-end:       #3B82F6;\n\n  /* ── Text colors ────────────────────────────────────────── */\n  --si-text-primary:        #111827;   /* headings, bold labels */\n  --si-text-secondary:      #374151;   /* body */\n  --si-text-tertiary:       #6B7280;   /* captions, placeholders */\n  --si-heading:             #122E44;   /* H1-level deep-navy headings */\n  --si-body:                #53606A;   /* default paragraph body */\n\n  /* ── Surfaces ───────────────────────────────────────────── */\n  --si-surface-base:        #F9FAFD;   /* page background — blue-tinted near-white */\n  --si-surface-alt:         #F9FAFB;   /* alternate panel bg */\n  --si-surface-elevated:    #FFFFFF;   /* cards, modals */\n\n  /* ── Borders ────────────────────────────────────────────── */\n  --si-border-default:      #E5E7EB;\n  --si-border-subtle:       #F3F4F6;\n\n  /* ── Status colors ──────────────────────────────────────── */\n  --si-success:             #16A34A;\n  --si-success-bg:          #F0FDF4;\n  --si-success-border:      #86EFAC;\n  --si-warning:             #CA8A04;\n  --si-warning-bg:          #FEFCE8;\n  --si-warning-border:      #FDE047;\n  --si-error:               #DC2626;\n  --si-error-bg:            #FEF2F2;\n  --si-error-border:        #FECACA;\n  --si-info:                #1D4ED8;\n  --si-info-bg:             #EFF6FF;\n  --si-info-border:         #BFDBFE;\n\n  /* ── Review-star amber (always use this for ratings) ────── */\n  --si-star-amber:          #F59E0B;\n  --si-star-amber-empty:    #E5E7EB;\n\n  /* ── Shadows ────────────────────────────────────────────── */\n  --si-shadow-sm:   0 1px 2px 0 rgba(0, 0, 0, 0.05);\n  --si-shadow-md:   0 4px 6px -1px rgba(0, 0, 0, 0.10), 0 2px 4px -1px rgba(0, 0, 0, 0.06);\n  --si-shadow-lg:   0 10px 15px -3px rgba(0, 0, 0, 0.10), 0 4px 6px -2px rgba(0, 0, 0, 0.05);\n  --si-shadow-xl:   0 20px 25px -5px rgba(0, 0, 0, 0.10), 0 10px 10px -5px rgba(0, 0, 0, 0.04);\n\n  /* Brand-distinctive: the card shadow leans blue, not neutral. */\n  --si-shadow-card: 0 2px 8px rgba(0, 112, 252, 0.08);\n\n  /* ── Spacing scale (4px base) ───────────────────────────── */\n  --si-space-1: 4px;\n  --si-space-2: 8px;\n  --si-space-3: 12px;\n  --si-space-4: 16px;\n  --si-space-5: 20px;\n  --si-space-6: 24px;\n  --si-space-8: 32px;\n  --si-space-10: 40px;\n  --si-space-12: 48px;\n  --si-space-16: 64px;\n\n  /* ── Border radius ──────────────────────────────────────── */\n  --si-radius-sm: 4px;\n  --si-radius-md: 8px;\n  --si-radius-lg: 12px;\n  --si-radius-xl: 16px;\n  --si-radius-2xl: 20px;\n  --si-radius-full: 9999px;\n\n  /* ── Typography scale (px) ──────────────────────────────── */\n  --si-font-display: 60px;   /* KPI hero numbers */\n  --si-font-h1:      32px;\n  --si-font-h2:      24px;\n  --si-font-h3:      20px;\n  --si-font-h4:      16px;\n  --si-font-body:    16px;\n  --si-font-label:   14px;\n  --si-font-caption: 12px;\n\n  --si-leading-tight:    1.25;\n  --si-leading-normal:   1.5;\n  --si-leading-relaxed:  1.6;\n\n  /* ── Z-index scale ──────────────────────────────────────── */\n  --si-z-base: 0;                /* @kind other */\n  --si-z-dropdown: 1000;         /* @kind other */\n  --si-z-sticky: 1020;           /* @kind other */\n  --si-z-fixed: 1030;            /* @kind other */\n  --si-z-modal-backdrop: 1040;   /* @kind other */\n  --si-z-modal: 1050;            /* @kind other */\n  --si-z-popover: 1060;          /* @kind other */\n  --si-z-tooltip: 1070;          /* @kind other */\n\n  /* ── Breakpoints (reference; use in @media) ─────────────── */\n  --si-bp-sm:  480px;\n  --si-bp-md:  768px;\n  --si-bp-lg:  1024px;\n  --si-bp-xl:  1280px;\n  --si-bp-2xl: 1440px;\n\n  /* ── Font stacks ────────────────────────────────────────── */\n  --si-font-sans: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\n  --si-font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;\n}\n\n/* ============================================================\n * Base + semantic typography\n * ============================================================ */\n\nhtml, body {\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  text-rendering: optimizeLegibility;\n  background-color: var(--si-surface-base);\n  color: var(--si-body);\n  font-family: var(--si-font-sans);\n  font-size: var(--si-font-body);\n  line-height: var(--si-leading-normal);\n  font-feature-settings: 'tnum' 1; /* tabular numerals everywhere */\n  margin: 0;\n  padding: 0;\n}\n\n* { font-family: inherit; }\n\np, span, li { color: var(--si-body); }\n\na {\n  color: var(--si-body);\n  text-decoration: none;\n  transition: color 0.2s ease;\n}\na:hover { color: var(--si-primary-accent); }\n\nh1, h2, h3, h4, h5, h6 {\n  color: var(--si-heading);\n  margin: 0;\n  font-family: var(--si-font-sans);\n}\n\nh1 { font-size: var(--si-font-h1); line-height: var(--si-leading-tight); font-weight: 700; }\nh2 { font-size: var(--si-font-h2); line-height: var(--si-leading-tight); font-weight: 600; }\nh3 { font-size: var(--si-font-h3); line-height: var(--si-leading-tight); font-weight: 600; }\nh4 { font-size: var(--si-font-h4); line-height: var(--si-leading-tight); font-weight: 600; }\nh5 { font-size: var(--si-font-label); line-height: var(--si-leading-tight); font-weight: 600; }\nh6 { font-size: var(--si-font-caption); line-height: var(--si-leading-tight); font-weight: 600; }\n\ncode, pre, .si-mono {\n  font-family: var(--si-font-mono);\n  font-size: 0.875em;\n}\n\n/* KPI / Display numbers */\n.si-display { font-size: var(--si-font-display); font-weight: 700; line-height: 1.1; color: var(--si-text-primary); font-variant-numeric: tabular-nums; }\n.si-kpi     { font-size: var(--si-font-h1);      font-weight: 700; line-height: 1.1; color: var(--si-text-primary); font-variant-numeric: tabular-nums; }\n\n/* Captions / helper text */\n.si-caption { font-size: var(--si-font-caption); color: var(--si-text-tertiary); line-height: var(--si-leading-relaxed); }\n.si-label   { font-size: var(--si-font-label);   font-weight: 600; color: var(--si-text-primary); }\n\n/* Eyebrow tag — small uppercase letter-spaced label */\n.si-eyebrow {\n  font-size: 10px;\n  font-weight: 700;\n  letter-spacing: 0.1em;\n  text-transform: uppercase;\n  color: var(--si-primary-accent);\n}\n\n/* Responsive type — mirrors @media (max-width: 768px) in src */\n@media (max-width: 768px) {\n  h1 { font-size: 24px; }\n  h2 { font-size: 20px; }\n  h3 { font-size: 16px; }\n  body { font-size: 14px; }\n}\n\n/* Focus rings (brand-correct blue accent) */\n*:focus-visible {\n  outline: 2px solid var(--si-primary-accent);\n  outline-offset: 2px;\n}\n\n/* ============================================================\n * Utility helpers — minimal; reach for these in vanilla HTML\n * mocks where Tailwind isn't loaded.\n * ============================================================ */\n\n.si-surface       { background: var(--si-surface-elevated); border: 1px solid var(--si-border-default); border-radius: var(--si-radius-lg); }\n.si-card          { background: var(--si-surface-elevated); border: 1px solid var(--si-border-default); border-radius: var(--si-radius-xl); box-shadow: var(--si-shadow-card); }\n.si-ai-gradient   { background: var(--si-ai-gradient); color: var(--si-ai-text); }\n.si-tabular       { font-variant-numeric: tabular-nums; }\n<\u002Fstyle>\n<style>/* ============================================================\n * SingleInterface — MOBILE tokens\n * Imports the shared brand tokens from colors_and_type.css and\n * adds mobile-only overrides + new mobile-native tokens.\n *\n * Use with: <link rel=\"stylesheet\" href=\"colors_and_type.css\">\n *           <link rel=\"stylesheet\" href=\"mobile_tokens.css\">\n * (order matters — mobile overrides come second)\n * ============================================================ */\n\n:root {\n  /* ── Mobile typography (iOS-flavored scale) ─────────────── */\n  /* The desktop scale is too large for a 375px viewport. These\n     are the canonical mobile sizes used across the kit. */\n  --m-font-largeTitle: 32px;   /* hero on landing only */\n  --m-font-title1:     28px;   /* screen titles */\n  --m-font-title2:     22px;   /* card titles */\n  --m-font-title3:     18px;   /* section titles */\n  --m-font-headline:   16px;   /* row primary, button text */\n  --m-font-body:       15px;   /* default body */\n  --m-font-callout:    14px;   /* secondary body */\n  --m-font-subhead:    13px;   /* meta */\n  --m-font-footnote:   12px;   /* captions */\n  --m-font-caption:    11px;   /* labels in nav */\n\n  --m-leading-tight:   1.2;\n  --m-leading-snug:    1.35;\n  --m-leading-normal:  1.45;\n\n  /* ── Touch targets (Apple HIG min: 44px) ────────────────── */\n  --m-touch-min:       44px;\n  --m-touch-comfy:     48px;\n  --m-touch-large:     56px;\n\n  /* ── Component canonical heights ─────────────────────────── */\n  --m-input-h:         44px;       /* every input — meets touch-min */\n  --m-row-min-h:       44px;       /* single-line list rows */\n  --m-chip-h:          32px;       /* filter chip (not a button) */\n  --m-btn-h:           48px;       /* primary CTA */\n  --m-btn-sm-h:        36px;       /* inline action buttons */\n\n  /* ── Chrome heights ─────────────────────────────────────── */\n  --m-statusbar:       44px;       /* iOS status bar (notch area) */\n  --m-navbar:          44px;       /* top nav bar (back / title / action) */\n  --m-largebar:        96px;       /* large nav bar with title */\n  --m-tabbar:          56px;       /* bottom tab bar (excl. home indicator) */\n  --m-homeind:         34px;       /* iOS home indicator */\n  --m-fab:             56px;       /* floating action button */\n\n  /* ── Safe areas (real device insets) ─────────────────────── */\n  --m-safe-top:        env(safe-area-inset-top, 0px);\n  --m-safe-bottom:     env(safe-area-inset-bottom, 0px);\n  --m-safe-left:       env(safe-area-inset-left, 0px);\n  --m-safe-right:      env(safe-area-inset-right, 0px);\n\n  /* ── Mobile spacing (denser than desktop) ────────────────── */\n  --m-gutter:          16px;       /* page horizontal padding */\n  --m-gutter-tight:    12px;\n  --m-gutter-loose:    20px;\n  --m-stack-tight:     8px;\n  --m-stack:           12px;\n  --m-stack-loose:     16px;\n  --m-stack-section:   24px;\n\n  /* ── Mobile radii ────────────────────────────────────────── */\n  --m-radius-input:    10px;\n  --m-radius-card:     14px;\n  --m-radius-sheet:    20px;   /* top corners on bottom sheets */\n  --m-radius-fab:      9999px;\n  --m-radius-tag:      9999px;\n\n  /* ── Mobile shadows (softer + more directional than desktop) */\n  --m-shadow-fab:      0 8px 24px rgba(0, 112, 252, 0.35), 0 2px 6px rgba(14, 0, 113, 0.15);\n  --m-shadow-sheet:    0 -8px 28px rgba(15, 23, 42, 0.10);\n  --m-shadow-card:     0 1px 2px rgba(15, 23, 42, 0.04), 0 2px 8px rgba(0, 112, 252, 0.06);\n  --m-shadow-tabbar:   0 -1px 0 rgba(0, 0, 0, 0.05);\n  --m-shadow-toast:    0 8px 24px rgba(15, 23, 42, 0.18);\n\n  /* ── Mobile motion ───────────────────────────────────────── */\n  --m-ease-out:        cubic-bezier(0.25, 0.46, 0.45, 0.94);  /* @kind other */\n  --m-ease-in-out:     cubic-bezier(0.4, 0, 0.2, 1);          /* @kind other */\n  --m-ease-sheet:      cubic-bezier(0.32, 0.72, 0, 1);        /* @kind other — iOS sheet curve */\n  --m-dur-fast:        160ms;   /* @kind other */\n  --m-dur-base:        240ms;   /* @kind other */\n  --m-dur-slow:        320ms;   /* @kind other */\n}\n\n/* ── Base resets for mobile-context HTML ─────────────────── */\nhtml, body {\n  font-size: var(--m-font-body);\n  line-height: var(--m-leading-normal);\n  -webkit-tap-highlight-color: transparent;\n  -webkit-touch-callout: none;\n  overscroll-behavior-y: contain;\n}\n\nbody {\n  /* prevent iOS pull-to-refresh accidents inside the design */\n  overscroll-behavior-x: none;\n}\n\n/* ── Mobile-native heading scale (overrides desktop H tags) */\nh1 { font-size: var(--m-font-title1); line-height: var(--m-leading-tight); font-weight: 700; }\nh2 { font-size: var(--m-font-title2); line-height: var(--m-leading-tight); font-weight: 600; }\nh3 { font-size: var(--m-font-title3); line-height: var(--m-leading-snug);  font-weight: 600; }\nh4 { font-size: var(--m-font-headline); line-height: var(--m-leading-snug); font-weight: 600; }\n\n/* ── Mobile utility classes ─────────────────────────────── */\n.m-largeTitle { font-size: var(--m-font-largeTitle); font-weight: 700; line-height: var(--m-leading-tight); letter-spacing: -0.02em; color: var(--si-text-primary); }\n.m-title1     { font-size: var(--m-font-title1); font-weight: 700; line-height: var(--m-leading-tight); color: var(--si-text-primary); }\n.m-title2     { font-size: var(--m-font-title2); font-weight: 600; line-height: var(--m-leading-tight); color: var(--si-text-primary); }\n.m-title3     { font-size: var(--m-font-title3); font-weight: 600; line-height: var(--m-leading-snug); color: var(--si-text-primary); }\n.m-headline   { font-size: var(--m-font-headline); font-weight: 600; color: var(--si-text-primary); }\n.m-body       { font-size: var(--m-font-body); font-weight: 400; color: var(--si-text-secondary); }\n.m-callout    { font-size: var(--m-font-callout); font-weight: 500; color: var(--si-text-secondary); }\n.m-subhead    { font-size: var(--m-font-subhead); font-weight: 500; color: var(--si-text-tertiary); }\n.m-footnote   { font-size: var(--m-font-footnote); font-weight: 400; color: var(--si-text-tertiary); }\n.m-caption    { font-size: var(--m-font-caption); font-weight: 500; color: var(--si-text-tertiary); letter-spacing: 0.02em; }\n\n.m-tabular    { font-variant-numeric: tabular-nums; }\n<\u002Fstyle>\n<style>\n  @keyframes si-spin { to { transform: rotate(360deg); } }\n  @keyframes si-screen-in { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: translateX(0); } }\n  @keyframes si-sheet-up { from { transform: translateY(100%); } to { transform: translateY(0); } }\n  @keyframes si-fade-in { from { opacity: 0; } to { opacity: 1; } }\n  @keyframes si-pop { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: scale(1); } }\n  .si-rng { -webkit-appearance:none; appearance:none; position:absolute; left:0; right:0; top:50%; transform:translateY(-50%); width:100%; height:22px; margin:0; background:transparent; pointer-events:none; }\n  .si-rng::-webkit-slider-thumb { -webkit-appearance:none; appearance:none; width:22px; height:22px; border-radius:50%; background:#fff; border:2px solid var(--si-primary-accent); box-shadow:0 1px 3px rgba(0,0,0,.25); pointer-events:auto; cursor:poi
